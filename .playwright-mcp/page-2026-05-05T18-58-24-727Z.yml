        - generic [ref=e297]: "[ FAQ ]"
        - heading "Frequently asked." [level=2] [ref=e298]
      - generic [ref=e299]:
        - generic [ref=e300]:
          - button "01 How quickly can I expect a return on a lighting upgrade?" [expanded] [ref=e301] [cursor=pointer]:
            - generic [ref=e302]: "01"
            - generic [ref=e303]: How quickly can I expect a return on a lighting upgrade?
          - paragraph [ref=e307]: For most commercial sites we engage with, projected payback falls between 12 and 18 months — driven by reduced consumption, lower demand charges, and extended fixture lifecycles. Every quote we issue includes the underlying calculation so you can verify it independently.
        - generic [ref=e308]:
          - button "02 Do you only work with new builds, or can you retrofit existing buildings?" [ref=e309] [cursor=pointer]:
            - generic [ref=e310]: "02"
            - generic [ref=e311]: Do you only work with new builds, or can you retrofit existing buildings?
          - paragraph [ref=e313]: Both. The majority of our portfolio is retrofit work in operational sites — offices, banks, hospitality, and warehousing — where we sequence the install to avoid disrupting trading hours.
        - generic [ref=e314]:
          - button "03 Where is your hardware sourced from?" [ref=e315] [cursor=pointer]:
            - generic [ref=e316]: "03"
            - generic [ref=e317]: Where is your hardware sourced from?
          - paragraph [ref=e319]: Direct from eight European OEMs including CP Electronics, Legrand, British General, Interra, Astro Lighting, Masterplug, Luceco, and Kingfisher Lighting. Authentic stock and full manufacturer warranties — never grey market.
        - generic [ref=e320]:
          - button "04 What does ongoing support look like?" [ref=e321] [cursor=pointer]:
            - generic [ref=e322]: "04"
            - generic [ref=e323]: What does ongoing support look like?
          - paragraph [ref=e325]: Every install is wrapped in a 24/7 nationwide service agreement. We monitor the system, respond to incidents, replace parts under warranty, and revisit optimisation as your occupancy patterns evolve.
        - generic [ref=e326]:
          - button "05 Do you offer financing or performance-share commercial models?" [ref=e327] [cursor=pointer]:
            - generic [ref=e328]: "05"
            - generic [ref=e329]: Do you offer financing or performance-share commercial models?
          - paragraph [ref=e331]: Yes — alongside conventional capex purchase, we structure financed and performance-share arrangements where appropriate. The right model is the one that fits your treasury position and the risk profile of the site.
