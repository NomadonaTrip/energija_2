      - generic [ref=e304]:
        - generic [ref=e305]: "[ FAQ ]"
        - heading "Frequently asked." [level=2] [ref=e306]
      - generic [ref=e307]:
        - generic [ref=e308]:
          - button "01 How quickly can I expect a return on a lighting upgrade?" [expanded] [ref=e309] [cursor=pointer]:
            - generic [ref=e310]: "01"
            - generic [ref=e311]: How quickly can I expect a return on a lighting upgrade?
          - paragraph [ref=e315]: For most commercial sites we engage with, projected payback falls between 12 and 18 months — driven by reduced consumption, lower demand charges, and extended fixture lifecycles. Every quote we issue includes the underlying calculation so you can verify it independently.
        - generic [ref=e316]:
          - button "02 Do you only work with new builds, or can you retrofit existing buildings?" [ref=e317] [cursor=pointer]:
            - generic [ref=e318]: "02"
            - generic [ref=e319]: Do you only work with new builds, or can you retrofit existing buildings?
          - paragraph [ref=e321]: Both. The majority of our portfolio is retrofit work in operational sites — offices, banks, hospitality, and warehousing — where we sequence the install to avoid disrupting trading hours.
        - generic [ref=e322]:
          - button "03 Where is your hardware sourced from?" [ref=e323] [cursor=pointer]:
            - generic [ref=e324]: "03"
            - generic [ref=e325]: Where is your hardware sourced from?
          - paragraph [ref=e327]: Direct from eight European OEMs including CP Electronics, Legrand, British General, Interra, Astro Lighting, Masterplug, Luceco, and Kingfisher Lighting. Authentic stock and full manufacturer warranties — never grey market.
        - generic [ref=e328]:
          - button "04 What does ongoing support look like?" [ref=e329] [cursor=pointer]:
            - generic [ref=e330]: "04"
            - generic [ref=e331]: What does ongoing support look like?
          - paragraph [ref=e333]: Every install is wrapped in a 24/7 nationwide service agreement. We monitor the system, respond to incidents, replace parts under warranty, and revisit optimisation as your occupancy patterns evolve.
        - generic [ref=e334]:
          - button "05 Do you offer financing or performance-share commercial models?" [ref=e335] [cursor=pointer]:
            - generic [ref=e336]: "05"
            - generic [ref=e337]: Do you offer financing or performance-share commercial models?
          - paragraph [ref=e339]: Yes — alongside conventional capex purchase, we structure financed and performance-share arrangements where appropriate. The right model is the one that fits your treasury position and the risk profile of the site.
