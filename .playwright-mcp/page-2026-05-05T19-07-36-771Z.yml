        - generic [ref=e300]: "[ FAQ ]"
        - heading "Frequently asked." [level=2] [ref=e301]
      - generic [ref=e302]:
        - generic [ref=e303]:
          - button "01 How quickly can I expect a return on a lighting upgrade?" [expanded] [ref=e304] [cursor=pointer]:
            - generic [ref=e305]: "01"
            - generic [ref=e306]: How quickly can I expect a return on a lighting upgrade?
          - paragraph [ref=e310]: For most commercial sites we engage with, projected payback falls between 12 and 18 months — driven by reduced consumption, lower demand charges, and extended fixture lifecycles. Every quote we issue includes the underlying calculation so you can verify it independently.
        - generic [ref=e311]:
          - button "02 Do you only work with new builds, or can you retrofit existing buildings?" [ref=e312] [cursor=pointer]:
            - generic [ref=e313]: "02"
            - generic [ref=e314]: Do you only work with new builds, or can you retrofit existing buildings?
          - paragraph [ref=e316]: Both. The majority of our portfolio is retrofit work in operational sites — offices, banks, hospitality, and warehousing — where we sequence the install to avoid disrupting trading hours.
        - generic [ref=e317]:
          - button "03 Where is your hardware sourced from?" [ref=e318] [cursor=pointer]:
            - generic [ref=e319]: "03"
            - generic [ref=e320]: Where is your hardware sourced from?
          - paragraph [ref=e322]: Direct from eight European OEMs including CP Electronics, Legrand, British General, Interra, Astro Lighting, Masterplug, Luceco, and Kingfisher Lighting. Authentic stock and full manufacturer warranties — never grey market.
        - generic [ref=e323]:
          - button "04 What does ongoing support look like?" [ref=e324] [cursor=pointer]:
            - generic [ref=e325]: "04"
            - generic [ref=e326]: What does ongoing support look like?
          - paragraph [ref=e328]: Every install is wrapped in a 24/7 nationwide service agreement. We monitor the system, respond to incidents, replace parts under warranty, and revisit optimisation as your occupancy patterns evolve.
        - generic [ref=e329]:
          - button "05 Do you offer financing or performance-share commercial models?" [ref=e330] [cursor=pointer]:
            - generic [ref=e331]: "05"
            - generic [ref=e332]: Do you offer financing or performance-share commercial models?
          - paragraph [ref=e334]: Yes — alongside conventional capex purchase, we structure financed and performance-share arrangements where appropriate. The right model is the one that fits your treasury position and the risk profile of the site.
