      - generic [ref=e122]:
        - paragraph [ref=e124]: Energija is a cleantech supply chain operator. We source intelligent lighting hardware from premium European manufacturers, then design, install, and maintain it across Nigerian commercial and industrial sites — turning energy waste into a measurable operating advantage.
        - generic [ref=e125]:
          - paragraph [ref=e126]: Most commercial spaces still rely on manual lighting control — switching off by hand, inconsistent schedules, or guesswork energy rationing. The result is wasted power, unpredictable bills, and declining profitability.
          - paragraph [ref=e127]: Our technical expertise and deep knowledge of Nigeria's energy infrastructure set us apart from one-size-fits-all alternatives. We offer flexible pricing, a wide product range from motion-sensor controls to complete LED retrofits, and responsive nationwide support.
